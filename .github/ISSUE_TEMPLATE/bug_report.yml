name: 问题反馈
description: 报告界面、路线、状态栏或导出问题
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Edge 版本 / Node.js 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与实际结果
      description: 请描述如何复现，以及原本预期的效果。附图请先遮挡姓名、账号和地址。
    validations:
      required: true
